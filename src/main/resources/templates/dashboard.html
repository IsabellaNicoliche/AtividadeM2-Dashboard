<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <title>Dashboard</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
        <link rel="stylesheet" th:href="@{/css/style.css}">
        <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    </head>

    <body>

        <aside>
            <div th:replace="~{fragments/sidebar :: sidebar}"></div>
        </aside>

        <div class="toggle-btn btn btn-dark d-md-none">
            <span>&#9776;</span>
        </div>

        <div class="container-fluid mt-4" th:fragment="content">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2 class="mb-0">Dashboard de Chamados</h2>
                <button id="btnAtualizar" type="button" class="btn btn-primary">
                    <i class="bi bi-arrow-clockwise"></i> Atualizar
                </button>
            </div>

            <div class="card mb-4">
                <div class="card-body">
                    <div class="row g-3 align-items-end">
                        <div class="col-md-2">
                            <label class="form-label" for="filtroStatus">Status</label>
                            <select id="filtroStatus" class="form-select">
                                <option value="">Todos</option>
                                <option value="ABERTO">Aberto</option>
                                <option value="EM_ANDAMENTO">Em Andamento</option>
                                <option value="CONCLUIDO">Concluído</option>
                            </select>
                        </div>
                        <div class="col-md-2">
                            <label class="form-label" for="filtroTipo">Tipo</label>
                            <select id="filtroTipo" class="form-select">
                                <option value="">Todos</option>
                            </select>
                        </div>
                        <div class="col-md-2">
                            <label class="form-label" for="filtroTecnico">Técnico</label>
                            <select id="filtroTecnico" class="form-select">
                                <option value="">Todos</option>
                            </select>
                        </div>
                        <div class="col-md-2">
                            <label class="form-label" for="filtroDataInicio">De</label>
                            <input id="filtroDataInicio" type="date" class="form-control">
                        </div>
                        <div class="col-md-2">
                            <label class="form-label" for="filtroDataFim">Até</label>
                            <input id="filtroDataFim" type="date" class="form-control">
                        </div>
                        <div class="col-md-2">
                            <label class="form-label" for="filtroAgrupamento">Agrupar período por</label>
                            <select id="filtroAgrupamento" class="form-select">
                                <option value="DIA">Dia</option>
                                <option value="MES">Mês</option>
                            </select>
                        </div>
                    </div>
                    <div class="row mt-3">
                        <div class="col-12 d-flex gap-2">
                            <button id="btnFiltrar" type="button" class="btn btn-primary">Filtrar</button>
                            <button id="btnLimpar" type="button" class="btn btn-outline-secondary">Limpar filtros</button>
                        </div>
                    </div>
                </div>
            </div>

            <div id="dashboardMensagem" class="alert alert-danger d-none" role="alert"></div>
            <div id="dashboardCarregando" class="text-muted mb-3 d-none">Carregando dados...</div>

            <div class="row g-3 mb-4">
                <div class="col-md-3">
                    <div class="card text-center">
                        <div class="card-body">
                            <h6 class="text-muted">Total de chamados</h6>
                            <h2 id="indicadorTotal">0</h2>
                        </div>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="card text-center">
                        <div class="card-body">
                            <h6 class="text-muted">Abertos</h6>
                            <h2 id="indicadorAbertos">0</h2>
                        </div>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="card text-center">
                        <div class="card-body">
                            <h6 class="text-muted">Em andamento</h6>
                            <h2 id="indicadorEmAndamento">0</h2>
                        </div>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="card text-center">
                        <div class="card-body">
                            <h6 class="text-muted">Concluídos</h6>
                            <h2 id="indicadorConcluidos">0</h2>
                            <small id="indicadorTempoMedio" class="text-muted"></small>
                        </div>
                    </div>
                </div>
            </div>

            <div class="row g-3">
                <div class="col-md-6">
                    <div class="card">
                        <div class="card-body">
                            <h5>Chamados por período</h5>
                            <canvas id="graficoPeriodo"></canvas>
                        </div>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="card">
                        <div class="card-body">
                            <h5>Situação dos chamados</h5>
                            <canvas id="graficoSituacao"></canvas>
                        </div>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="card">
                        <div class="card-body">
                            <h5>Tipos mais atendidos</h5>
                            <canvas id="graficoTipos"></canvas>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <script th:src="@{/js/script.js}"></script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
        <script th:src="@{/js/dashboard.js}"></script>
    </body>
</html>
